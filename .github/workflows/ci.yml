name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A second lockfile means the artifact we ship and the artifact CI
      # validates can resolve different dependency trees. npm is the source of
      # truth because AMO reviewers rebuild with `npm ci`.
      - name: Single lockfile
        run: |
          test ! -f bun.lock -a ! -f yarn.lock -a ! -f pnpm-lock.yaml \
            || { echo "::error::More than one lockfile is present"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npx dprint check
      # Every .tree file is a specification. Left unchecked it drifts from the
      # tests it describes, and a spec nobody has read in six months is worse
      # than no spec at all.
      - name: Trees match their tests
        run: npm run test:trees

      # Unit tests plus the golden corpus: saved markup shapes from real sites,
      # which is the only thing that pins detection against the actual web.
      #
      # Coverage is a GATE at 100%, not a target to drift toward: a line
      # nobody executes is a line nobody has checked. Two of the bugs this
      # suite has caught in shipped code lived on untested branches.
      # `npm run uncovered` names the missing arm when this fails.
      - run: npm run test:coverage

      # Coverage says a line RAN. It cannot say the assertion was right, and
      # that gap shipped real bugs: three defects in v1.1.1 had tests asserting
      # the broken behaviour as correct, at 100% coverage, each with a tree.
      # This puts every bug we have shipped back, one at a time, and fails if
      # the suite does not notice. Slower than the rest of CI and worth it.
      - run: npm run test:mutants

      # The full mutation run: every mutation Stryker can generate, not just
      # the bugs we already know about. Slow — around ten minutes — so it sits
      # after the fast gates rather than in front of them.
      #
      # The threshold is 100 and it breaks the build. That is deliberate: a
      # surviving mutant is a change to the source that no test noticed, and
      # this codebase has already shipped six bugs while line coverage read
      # 100%. Where a mutant genuinely cannot be observed, it is annotated in
      # the source with the argument for why — never suppressed silently.
      - run: npm run test:mutation
      - run: npm run build
      - run: npm run build:firefox

      # addons-linter refuses to parse any single JS file over 5MB, which is
      # what kept Zentat off AMO. Fail here rather than at submission.
      # addons-linter refuses to parse any single JS file over 5MB, which is what
      # kept Zentat off AMO. .wasm is scanned as binary and is exempt at any
      # size, so the check is deliberately JS-only.
      - name: No oversized JS bundles
        run: |
          big=$(find dist -name '*.js' -size +4M 2>/dev/null || true)
          test -z "$big" || { echo "::error::JS file over 4MB: $big"; exit 1; }

      # The Nym WASM must ship as separate binaries, not inlined into JS. If a
      # dependency bump silently reverts that, the Firefox listing dies again.
      - name: Nym WASM ships as separate binaries
        run: |
          for f in go_conn.wasm mix_fetch_wasm_bg.wasm; do
            test -f "dist/firefox-mv2/assets/$f" \
              || { echo "::error::missing dist/firefox-mv2/assets/$f"; exit 1; }
          done

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: xvfb-run -a npm run test:e2e
