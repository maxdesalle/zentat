<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Zentat</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="preload">
    <div class="popup">
      <header class="header">
        <div class="header-text">
          <h1 class="title">Zentat</h1>
          <p class="subtitle" id="state-line">Converting prices · <kbd>Alt+Z</kbd></p>
        </div>
        <label class="toggle">
          <input type="checkbox" id="enabled" checked aria-label="Convert prices to ZEC" />
          <span class="slider"></span>
        </label>
      </header>

      <div class="site-row" id="site-row" hidden>
        <span class="site-name" id="site-name"></span>
        <button id="site-toggle" class="btn btn-small"></button>
      </div>

      <div class="rate-section">
        <div class="rate-row">
          <div class="rate-display">
            <span class="rate-label">1 ZEC =</span>
            <span class="rate-value" id="zec-fiat-value">--</span>
            <span class="rate-unit rate-unit-fiat" id="zec-fiat-unit">USD</span>
          </div>
          <div class="rate-display rate-display-small">
            <span class="rate-label" id="fiat-zec-label">1 USD =</span>
            <span class="rate-value-small" id="fiat-zec-value">--</span>
            <span class="rate-unit">ZEC</span>
          </div>
        </div>
        <div class="rate-meta">
          <span id="source">--</span>
          <span class="separator">·</span>
          <span id="updated">--</span>
          <span class="nym-status" id="nym-status"></span>
        </div>
        <p class="status-line" id="status-line" hidden></p>
      </div>


      <section class="position" id="position" hidden>
        <div class="position-head">
          <span class="position-label">Your month</span>
          <span class="position-net" id="position-net">--</span>
        </div>
        <div class="position-detail">
          <span id="position-in">--</span>
          <span class="separator">·</span>
          <span id="position-out">--</span>
        </div>
        <p class="position-gaps" id="position-gaps" hidden></p>
      </section>

      <div class="actions">
        <button id="refresh" class="btn btn-secondary">Refresh</button>
        <button id="practice" class="btn btn-secondary">Practice</button>
        <button id="options" class="btn btn-primary">Options</button>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
